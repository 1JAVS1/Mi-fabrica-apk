
name: Crear Fabrica
on: [workflow_dispatch]
jobs:
  crear:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Crear V13 Ultra Simple
        run: |
          rm -rf app build.gradle settings.gradle gradle 2>/dev/null; true
          mkdir -p app/src/main/java/com/fabrica/maestra
          mkdir -p gradle/wrapper
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.fabrica.maestra'
            compileSdk 34
            defaultConfig { applicationId "com.fabrica.maestra"; minSdk 24; targetSdk 34; versionCode 13; versionName "13.0" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Fabrica V13" android:theme="@android:style/Theme.Material.Light">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/fabrica/maestra/MainActivity.java <<'JAVA'
          package com.fabrica.maestra;
          import android.app.Activity; import android.os.Bundle; import android.widget.*;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){ super.onCreate(b); TextView t=new TextView(this); t.setText("FABRICA V13 OK - COMPILA"); t.setTextSize(24); setContentView(t); }
          }
          JAVA
      - name: Push
        run: |
          git config user.name "fabrica"; git config user.email "fabrica@bot.com"
          git branch -M main
          git add app build.gradle settings.gradle gradle/wrapper
          git commit -m "V13 ultra simple" || true
          git push origin HEAD:main -f
