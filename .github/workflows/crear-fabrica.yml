          rm /tmp/f.b64
          echo "Creating app/build.gradle"
          mkdir -p $(dirname app/build.gradle)
          rm -f /tmp/f.b64
          echo -n "" >> /tmp/f.b64
          base64 -d /tmp/f.b64 > app/build.gradle
