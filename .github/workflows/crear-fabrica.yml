          rm -f /tmp/f.b64
          echo -n "ZGlzdHJpYnV0aW9uVXJsPWh0dHBzXDovL3NlcnZpY2VzLmdyYWRsZS5vcmcvZGlzdHJpYnV0aW9ucy9ncmFkbGUtOC41LWJpbi56aXAK" >> /tmp/f.b64
