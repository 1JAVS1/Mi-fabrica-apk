name: SENE V21 VALIDADOR
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: V21 validador + descarga
        run: |
          rm -f /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64

          base64 -d /tmp/j.b64 > app/src/main/java/com/sene/fabrica/MainActivity.java
      - name: Push V21
        run: |
          git config user.name "SENE"; git config user.email "sene@v21.com"
          git add app/src/main/java/com/sene/fabrica/MainActivity.java
          git commit -m "V21 validador + descarga directa" || true
          git push origin HEAD:main -f
