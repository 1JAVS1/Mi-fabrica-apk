          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          base64 -d /tmp/j.b64 > app/src/main/java/com/sene/fabrica/MainActivity.java
      - name: Push
        run: |
          git config user.name "SENE"; git config user.email "s@v23.com"
