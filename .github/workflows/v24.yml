name: SENE V24 FIX BASE64
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix V24 base64
        run: |
          rm -f /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          base64 -d /tmp/j.b64 > app/src/main/java/com/sene/fabrica/MainActivity.java
      - name: Push
        run: |
          git config user.name "SENE"; git config user.email "s@v24.com"
          git add app/src/main/java/com/sene/fabrica/MainActivity.java
          git commit -m "V24 fix base64 NO_WRAP" || true
          git push origin HEAD:main -f
