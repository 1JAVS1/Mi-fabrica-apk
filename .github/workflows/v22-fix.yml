name: SENE V22 FIX
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix V22
        run: |
          rm -f /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          echo -n "" >> /tmp/j.b64
          base64 -d /tmp/j.b64 > app/src/main/java/com/sene/fabrica/MainActivity.java
      - name: Push
        run: |
          git config user.name "SENE"; git config user.email "s@v22.com"
          git add app/src/main/java/com/sene/fabrica/MainActivity.java
          git commit -m "V22 fix valido" || true
          git push origin HEAD:main -f
