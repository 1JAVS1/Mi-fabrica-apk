plugins {
    id 'com.android.application' version '8.2.2'
}
android {
    namespace 'com.sene.fabrica'
    compileSdk 34
    defaultConfig {
        applicationId "com.sene.fabrica"
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName "17.0 SENE FIX"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
